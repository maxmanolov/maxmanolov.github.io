        <h1 id="intro-title">Max Manolov</h1>
        <p>
          I study computer science at Stanford with a focus on machine learning
          systems. I’m interested in GPUs, distributed training and inference,
          compilers and accelerators, and reinforcement learning.
        </p>
      </section>

          </div>
          <a href="https://github.com/maxmanolov" target="_blank" rel="noreferrer">
            @maxmanolov
          </a>
        </header>

        <div class="graph-wrap">

            class="graph"

            aria-label="GitHub contributions over the last three months"
